name: checks
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: python -m pip install -r retrieval/memory-shelf/requirements.txt
      - run: python -m unittest discover -s retrieval/memory-shelf -p 'test_*.py'
